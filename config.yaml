llamastack:
  base_url: "http://lss-ai-agent.apps.cluster-p4mxv.p4mxv.sandbox338.opentlc.com"
  default_model: "meta-llama/Llama-3.1-8B-Instruct"

# LLM Model configuration (separate from LlamaStack)
llm:
  api_base: "http://llm-ai-agent.apps.cluster-p4mxv.p4mxv.sandbox338.opentlc.com/v1"
  model: "meta-llama/Llama-3.1-8B-Instruct"

file_storage:
  upload_dir: "./uploads"
  max_file_size: 10485760  # 10MB
  allowed_extensions: [".rb", ".yml", ".yaml", ".json", ".tf", ".pp", ".erb", ".conf", ".sls", ".py"]

vector_db:
  default_db_id: "iac"
  default_chunk_size: 512

agent_instructions:
  chef_analysis: |
    You are an expert Chef cookbook analyst specializing in infrastructure automation and migration to modern IaC platforms.
    You will be provided with:
    - Verified facts about a Chef cookbook (packages, services, templates, dependencies, complexity score, etc.)
    - Cookbook file content

    Your job is to analyze all provided facts and return ONLY a JSON object with the following fields.

    CRITICAL for the `detailed_analysis` field:
    - Write a detailed, multi-paragraph, technical summary (150-200 words).
    - Cover the cookbook's main purpose, how it works, complexity, resources, dependencies, key operations, wrapper logic (if any), and any migration caveats or best practices.
    - Write for an engineering audience (clear, concise, no code fences).
    - Include Chef-specific insights like resource types used, attribute patterns, template complexity, and service management approaches.
    - You MAY use markdown-style bullet points or numbered lists for clarity.
    - Do NOT include any text outside the JSON.

    CRITICAL for assessment data quality:
    - Provide Chef-specific configuration details (attribute usage, resource patterns, template complexity)
    - Give meaningful migration effort estimates based on actual cookbook complexity
    - Include real Chef-specific risk factors (deprecated resources, complex dependencies, etc.)
    - Assess conversion readiness with Chef-specific criteria
    - Provide detailed conversion notes with Chef-to-Ansible mapping insights

    Here is the required JSON structure (fill all fields):

    {
      "success": true,
      "cookbook_name": "extracted from metadata.rb or inferred",
      "version_requirements": {
        "min_chef_version": "actual version like >= 15.0",
        "min_ruby_version": "actual version like >= 2.5",
        "migration_effort": "LOW|MEDIUM|HIGH",
        "estimated_hours": number,
        "deprecated_features": ["list of deprecated Chef resources/patterns found"]
      },
      "dependencies": {
        "is_wrapper": boolean,
        "wrapped_cookbooks": ["list of included cookbooks"],
        "direct_deps": ["actual cookbook dependencies"],
        "runtime_deps": ["actual runtime dependencies"],
        "circular_risk": "none|low|medium|high"
      },
      "functionality": {
        "primary_purpose": "detailed Chef-specific purpose description",
        "services": ["actual service names that Chef manages"],
        "packages": ["actual package names that Chef installs"],
        "files_managed": ["actual file paths managed by Chef"],
        "reusability": "LOW|MEDIUM|HIGH",
        "customization_points": ["list of Chef-specific customization points"]
      },
      "recommendations": {
        "consolidation_action": "REUSE|EXTEND|REWRITE",
        "rationale": "detailed Chef-specific reasoning",
        "migration_priority": "LOW|MEDIUM|HIGH",
        "risk_factors": ["Chef-specific risk factors"],
        "migration_steps": ["detailed Chef-to-Ansible migration steps"]
      },
      "complexity_level": "Low|Medium|High",
      "detailed_analysis": "Your detailed, multi-paragraph technical summary with Chef-specific insights.",
      "key_operations": ["actual Chef operations performed"],
      "configuration_details": "Chef-specific configuration details (attributes, resources, templates)",
      "conversion_notes": "detailed Chef-to-Ansible conversion guidance",
      "convertible": boolean,
      "confidence_source": "pattern_analysis|llm_analysis|combined"
    }

  context: |
    You are a RAG retrieval assistant specializing in Infrastructure as Code patterns.

    MANDATORY WORKFLOW - FOLLOW EXACTLY:
    1. IMMEDIATELY call the knowledge_search tool with the user's exact input as the query parameter.
    2. WAIT for the complete tool response with retrieved content.
    3. If the tool returns relevant content, format and return it clearly.
    4. If no relevant content is found, respond: "No relevant patterns found for this input."

    CRITICAL RULES:
    - NEVER respond without first calling the knowledge_search tool
    - NEVER generate answers from your own knowledge
    - ALWAYS use the user's input as the search query
    - The knowledge_search tool will access the Infrastructure as Code vector database
    - Return retrieved content in a clear, organized format

  generate: |
    You are an expert Ansible automation engineer.
    Generate ONLY valid, modern Ansible Core 2.15+ YAML playbooks from user input and context.

    Requirements:
    - Output valid YAML only (no markdown, no comments, no explanations).
    - Use fully-qualified collection names (FQCN) for all modules.
    - Begin playbooks with '---' and use a single 'tasks:' and 'handlers:' block per play.
    - Place 'collections:' at play level (do not repeat).
    - Use 'become: true' for privilege escalation.
    - Use 'when: ansible_facts[...]' for all conditionals.
    - Use 'vars:' and 'vars_files:' as appropriate.
    - Use 'notify:' in tasks and define all handlers under 'handlers:'.
    - For sensitive tasks, use 'no_log: true'; for file edits, use 'backup: true' and 'mode:'.
    - Only output YAML—never markdown, never explanations.



prompts:
  chef_analysis_enhanced: |
    SYSTEM INSTRUCTION:
    {instruction}

    COOKBOOK CONTEXT:
    <COOKBOOK>
    {cookbook_content}
    </COOKBOOK>
    <PATTERN_FACTS>
    {pattern_facts}
    </PATTERN_FACTS>

    ANALYSIS GUIDANCE:
    - Focus on Chef-specific patterns: resource types, attribute usage, template complexity, service management
    - Assess migration complexity based on actual Chef resources found (packages, services, templates, files)
    - Provide Chef-to-Ansible conversion insights (e.g., package resource → ansible.builtin.package)
    - Consider Chef-specific risk factors: deprecated resources, complex dependencies, wrapper cookbooks
    - Evaluate conversion readiness using Chef-specific criteria (resource complexity, dependency depth, template usage)
    - Give meaningful migration effort estimates based on actual cookbook structure and complexity
    - Include detailed conversion notes with specific Chef-to-Ansible mappings

    Now, analyze all the facts above and return ONLY a single, valid JSON object that fills EVERY required field as shown in the structure above.
    **CRITICAL:** Do NOT include markdown, comments, prose, or explanations—ONLY the JSON object. All fields MUST be filled in contextually and appropriately with Chef-specific insights.

  context: |
    USER QUERY: {user_input}
    You are a retrieval assistant for Infrastructure as Code patterns.
    Use the knowledge_search tool to find relevant information.
    Always respond to tool calls with valid, double-quoted JSON ONLY. Never add extra text, explanations, or comments.

  generate: |
    {instruction}

    EXAMPLE OF MODERN, PRODUCTION-GRADE ANSIBLE PLAYBOOK FORMAT:

    ---
    - name: <Descriptive Playbook Name>
      hosts: <target_group_or_all>
      become: true
      collections:
        - ansible.builtin
        # - community.<collection>
      vars:
        # Define variables as needed
      tasks:
        - name: Install required packages
          ansible.builtin.package:
            name: "{{ item }}"
            state: present
            use: <apt|yum>
          loop:
            - <package1>
            - <package2>
        - name: Ensure services are running
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: started
            enabled: yes
          loop:
            - <service1>
            - <service2>
        - name: Manage config files
          ansible.builtin.template:
            src: <template.j2>
            dest: <path>
            mode: '0644'
          notify: restart <service>
      handlers:
        - name: restart <service>
          ansible.builtin.systemd:
            name: <service>
            state: restarted

    [CONTEXT]
    {context}

    [INPUT CODE TO CONVERT]
    {input_code}

    OUTPUT: Only the YAML playbook, never markdown or explanations.



agents:
  - name: "chef_analysis"
    model: "meta-llama/Llama-3.1-8B-Instruct"
    instructions: "{agent_instructions.chef_analysis}"
    sampling_params:
      strategy:
        type: "greedy"
        temperature: 0.1
      max_tokens: 2048
      repetition_penalty: 1.0
    max_infer_iters: 1

  - name: context
    model: meta-llama/Llama-3.1-8B-Instruct
    instructions: "{agent_instructions.context}"
    sampling_params:
      strategy:
        type: greedy
      max_tokens: 4096
    toolgroups:
      - name: "builtin::rag/knowledge_search"
        args:
          vector_db_ids: ["iac"]
          query_config:
            chunk_size_in_tokens: 512
            chunk_overlap_in_tokens: 0
            chunk_template: "Result {index}\nContent: {chunk.content}\nMetadata: {metadata}\n"
            top_k: 3
    tool_config:
      tool_choice: auto
    max_infer_iters: 3

  - name: "generate"
    model: "meta-llama/Llama-3.1-8B-Instruct"
    instructions: "{agent_instructions.generate}"
    sampling_params:
      strategy:
        type: "greedy"
        temperature: 0.1
      max_tokens: 2048    # or adjust for your max output needs
    max_infer_iters: 1

