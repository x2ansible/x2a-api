apiVersion: v1
kind: Pod
metadata:
  name: langfuse-stack
spec:
  restartPolicy: Always
  containers:
    # 1) Postgres
    - name: postgres
      image: docker.io/library/postgres:15-alpine
      env:
        - name: POSTGRES_USER
          value: lfuser
        - name: POSTGRES_PASSWORD
          value: lfpass
        - name: POSTGRES_DB
          value: langfuse
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data

    # 2) ClickHouse (server)
    - name: clickhouse
      image: docker.io/clickhouse/clickhouse-server:24.8
      env:
        # Enables password-based users (including the default user)
        - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
          value: "1"
        # Set password for the `default` user on first run
        - name: CLICKHOUSE_PASSWORD
          value: ch_password
      ports:
        - containerPort: 9000   # native TCP (for migrations)
        - containerPort: 8123   # HTTP interface
      volumeMounts:
        - name: ch-data
          mountPath: /var/lib/clickhouse

    # 3) MinIO (S3-compatible)
    - name: minio
      image: docker.io/minio/minio:latest
      env:
        - name: MINIO_ROOT_USER
          value: minio
        - name: MINIO_ROOT_PASSWORD
          value: miniosecret
      args:
        # API on 9002, console on 9003 (avoid common conflicts)
        - server
        - /data
        - --address=:9002
        - --console-address=:9003
      ports:
        - containerPort: 9002
        - containerPort: 9003
      volumeMounts:
        - name: minio-data
          mountPath: /data

    # 4) Langfuse web
    - name: langfuse-web
      image: ghcr.io/langfuse/langfuse:3
      env:
        - name: NODE_ENV
          value: production
        - name: NEXTAUTH_URL
          value: http://localhost:3000
        - name: NEXTAUTH_SECRET
          value: devsecret_change_me

        # REQUIRED: strong random salt (>=32 bytes, base64 recommended)
        - name: SALT
          value: "PASTE_A_STRONG_BASE64_SALT"

        # Postgres (same pod => localhost)
        - name: DATABASE_URL
          value: postgres://lfuser:lfpass@localhost:5432/langfuse

        # ClickHouse (same pod => localhost)
        - name: CLICKHOUSE_USER
          value: default
        - name: CLICKHOUSE_PASSWORD
          value: ch_password
        - name: CLICKHOUSE_DB
          value: default
        - name: CLICKHOUSE_CLUSTER_ENABLED
          value: "false"
        - name: CLICKHOUSE_URL
          value: http://default:ch_password@localhost:8123
        - name: CLICKHOUSE_MIGRATION_URL
          value: clickhouse://default:ch_password@localhost:9000/default

        # S3 via MinIO
        - name: LANGFUSE_S3_ENDPOINT
          value: http://localhost:9002
        - name: LANGFUSE_S3_REGION
          value: us-east-1
        - name: LANGFUSE_S3_ACCESS_KEY_ID
          value: minio
        - name: LANGFUSE_S3_SECRET_ACCESS_KEY
          value: miniosecret
        - name: LANGFUSE_S3_BUCKET
          value: langfuse-events

        - name: PORT
          value: "3000"
      ports:
        # Host-port map so you can open http://localhost:3000
        - containerPort: 3000
          hostPort: 3000

  initContainers:
    # Wait for Postgres to accept connections
    - name: wait-for-postgres
      image: docker.io/library/postgres:15-alpine
      command: ["sh","-c","until pg_isready -h localhost -p 5432 -U lfuser; do sleep 1; done"]

    # Wait for ClickHouse HTTP & TCP
    - name: wait-for-clickhouse
      image: docker.io/busybox:latest
      command: ["sh","-c","until nc -z localhost 8123 && nc -z localhost 9000; do sleep 1; done"]

    # Create MinIO bucket (idempotent)
    - name: minio-mc-init
      image: docker.io/minio/mc:latest
      env:
        - name: MINIO_ROOT_USER
          value: minio
        - name: MINIO_ROOT_PASSWORD
          value: miniosecret
      command:
        - sh
        - -c
        - |
          set -e
          # wait for minio api
          until (mc alias set local http://localhost:9002 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"); do
            echo "waiting for minio..."
            sleep 2
          done
          mc mb -p local/langfuse-events || true

  volumes:
    - name: pgdata
      emptyDir: {}
    - name: ch-data
      emptyDir: {}
    - name: minio-data
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
spec:
  selector:
    # Podman doesn't support label selectors the same way as k8s deployments,
    # but this Service can still be useful in some environments. Access via hostPort above.
    # If you want cluster IP routing, ensure your runtime supports it.
    name: langfuse-stack
  ports:
    - name: http
      port: 3000
      targetPort: 3000
